apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: kube-hello-kiali
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: kube-hello-kiali.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

