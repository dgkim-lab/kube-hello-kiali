apiVersion: apps/v1
kind: Deployment
metadata:
  name: challenge-api
  namespace: rps
  labels:
    app: challenge-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: challenge-api
  template:
    metadata:
      labels:
        app: challenge-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: challenge-api
          image: ghcr.io/dgkim-lab/kube-hello-kiali-challenge-api:198ae3406a5aa897f58403d1c0c047e3d33015f4
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: JUDGE_API_URL
              value: http://judge-api:8081
            - name: OTEL_SERVICE_NAME
              value: challenge-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.jaeger:4318
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
