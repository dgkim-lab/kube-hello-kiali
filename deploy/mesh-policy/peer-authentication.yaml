apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: rps
spec:
  mtls:
    mode: PERMISSIVE
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: challenge-api-permissive
  namespace: rps
spec:
  selector:
    matchLabels:
      app: challenge-api
  mtls:
    mode: PERMISSIVE
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: judge-api-strict
  namespace: rps
spec:
  selector:
    matchLabels:
      app: judge-api
  mtls:
    mode: STRICT
