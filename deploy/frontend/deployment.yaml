apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rps
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/dgkim-lab/kube-hello-kiali-frontend:198ae3406a5aa897f58403d1c0c047e3d33015f4
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
