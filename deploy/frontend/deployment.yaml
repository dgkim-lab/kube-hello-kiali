apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kube-hello-kiali
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/dgkim-lab/kube-hello-kiali-frontend:46f6aba59d4142ea9d23bfa3126bf7329a997d99
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
