apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kube-hello-kiali
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/dgkim-lab/kube-hello-kiali-frontend:8608ce4a5f2a1925a5c51dad039b1b927a71d8ae
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
